services:
  dashboard:
    build: ./my-dashboard
    container_name: evidence-dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./my-dashboard/pages:/app/pages
      - ./my-dashboard/sources:/app/sources
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - PORT=3000